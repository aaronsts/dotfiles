"$schema": "https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json"
version: 4

blocks:
  - type: prompt
    alignment: left
    segments:
      - type: session
        style: plain
        foreground: red
        template: "{{ .UserName }} "

      - type: path
        style: plain
        foreground: lightCyan
        template: "{{ .Path }} "
        options:
          style: full

      - type: git
        style: plain
        foreground: magenta
        template: "{{ .UpstreamIcon }}{{ .HEAD }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }}"
        options:
          branch_icon: ""
          fetch_status: true

  - type: prompt
    alignment: left
    newline: true
    segments:
      - type: text
        style: plain
        foreground: green
        template: "❯ "

transient_prompt:
  foreground: green
  background: transparent
  template: "❯ "
